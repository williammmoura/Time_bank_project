<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de horas</title>
</head>
<body>
    <fieldset>
        <legend>Dados do registro de horas</legend>
        <form action="" id="time_form">
        
            <label for="start_time">Hora de entrada:</label>
            <input type="text" id="start_time" placeholder="HH:MM" required>
            
            <label for="break_start">Hora de início do intervalo:</label>
            <input type="text" id="break_start" placeholder="HH:MM">
            
            <label for="break_end">Hora de término do intervalo:</label>
            <input type="text" id="break_end" placeholder="HH:MM">
            
            <label for="end_time">Hora de término:</label>
            <input type="text" id="end_time" placeholder="HH:MM" required>
            
            <button type="submit">Registrar horas</button>

        </form>
    </fieldset>
</body>
<script src="../scripts/script.js"></script>
</html>
