<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/style.css">
    <title>Banco de horas</title>
</head>
<body>
    <form id="time_form">
    <fieldset>
        <legend>Jornada diária de Trabalho</legend>

        <label for="expected_daily_hours">Duração da jornada de trabalho:</label>
        <input type="time" id="expected_daily_hours" required>
    </fieldset>

    <fieldset>
        <legend>Dados do registro de horas</legend>

        <label for="work_start_time">Hora de entrada:</label>
        <input type="time" id="work_start_time" required>

        <label for="break_start_time">Hora de início do intervalo:</label>
        <input type="time" id="break_start_time" required>

        <label for="break_end_time">Hora de término do intervalo:</label>
        <input type="time" id="break_end_time" required>

        <label for="work_end_time">Hora de término:</label>
        <input type="time" id="work_end_time" required>

        <button type="submit">Registrar horas</button>
    </fieldset>
</form>

    <div id="dashboard">

        <div class="card_container">
            <div class="card" id="card_total_worked"></div>
            <div class="card" id="card_expected_work"></div>
            <div class="card" id="card_balance"></div>
            <div class="card" id="card_overtime"></div>
        </div>

        <div id="timeline_container">
            <div id="timeline_bar"></div>
        </div>

        <div id="progress_container">
            <div id="progress_bar"></div>
        </div>
        
    </div>
</body>
<script type="module" src="../scripts/main.js"></script>
</html>
